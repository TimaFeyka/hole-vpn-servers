name: Update VPN servers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: update-vpn-servers
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build feed
        run: python scripts/build_feed.py
      - name: Validate generated JSON
        run: python -m json.tool data/servers.json >/dev/null
      - name: Publish changed feed
        run: |
          if git diff --quiet -- data; then
            echo "Feed is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update VPN server feed"
          git push
